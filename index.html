/* Personagem cartoon: animacao minima (translateY). Se o CSS falhar, o personagem parado continua visivel. */
/* ============ PERSONAGEM CARTOON: SVG simples + flutuacao suave ============
   Apenas o container flutua (translateY -4px). Nenhuma animacao de r/rx/ry,
   nenhum transform-origin complexo: o personagem aparece em qualquer navegador. */
.fig-float{animation:figFloat 2.8s ease-in-out infinite}
@keyframes figFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

/* ============ DASHBOARD: graficos animados em CSS/SVG puro ============ */
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.bar-grow{transform-origin:bottom;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
.fin-line{stroke-dasharray:100;stroke-dashoffset:100;animation:drawLine 1.4s ease-out forwards}
@keyframes drawLine{to{stroke-dashoffset:0}}
.fin-area{opacity:0;animation:fadeIn 1s ease .7s forwards}
.fin-dot{opacity:0;animation:fadeIn .4s ease forwards}
@keyframes fadeIn{to{opacity:1}}
.donut-seg{animation:donutIn 1.1s ease both}
@keyframes donutIn{from{stroke-dasharray:0 100}}
.kpi-num{font-variant-numeric:tabular-nums}
/* Corpo do personagem: bounce suave de 4px (translateY — sem animar r/rx/ry) */
.fig-bounce{animation:figBounce 2.4s ease-in-out infinite}
@keyframes figBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
/* Bracos: rotacao leve no ombro (transform-origin em px absolutos do viewBox) */
.arm{animation:armSwing var(--sw-dur,2.2s) ease-in-out infinite;animation-delay:var(--sw-delay,0s)}
@keyframes armSwing{0%,100%{transform:rotate(var(--sw-from,-14deg))}50%{transform:rotate(var(--sw-to,14deg))}}
/* Palco do personagem (raiz do card) + selo de foco do musculo */
.char-stage{position:relative;display:flex;align-items:center;justify-content:center;background:#1a1f14;border-radius:12px 12px 0 0;overflow:hidden}
.char-focus{position:absolute;top:8px;left:8px;z-index:2;font-size:10px;font-weight:800;background:#C6FF00;color:#000;padding:3px 10px;border-radius:999px}
.char-svg{display:block;overflow:visible}

/* ============ PERSONAGEM: animacoes por familia de exercicio ============
   Apenas rotate/translateY, transform-origin em px absolutos do viewBox.
   .arm-group = articulacao do braco; .body-group = tronco.
   Se o CSS falhar, o personagem parado continua visivel (sem animacao). */
@keyframes curlAnim{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-65deg)}}
@keyframes curlAnimR{0%,100%{transform:rotate(0deg)}50%{transform:rotate(65deg)}}
@keyframes pressAnim{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes squatAnim{0%,100%{transform:translateY(0)}50%{transform:translateY(9px)}}
@keyframes pullAnim{0%,100%{transform:translateY(-6px)}50%{transform:translateY(8px)}}
@keyframes lateralAnim{0%,100%{transform:rotate(0deg)}50%{transform:rotate(35deg)}}
@keyframes lateralAnimR{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-35deg)}}
@keyframes crunchAnim{0%,100%{transform:rotate(0deg)}50%{transform:rotate(18deg)}}
.anim-curl .arm-group{animation:curlAnim 1.6s ease-in-out infinite;transform-origin:70px 85px}
.anim-curl .fore-r.arm-group{animation-name:curlAnimR}
.anim-press .arm-group{animation:pressAnim 1.8s ease-in-out infinite}
.anim-squat .body-group{animation:squatAnim 2s ease-in-out infinite}
.anim-pull .arm-group{animation:pullAnim 1.8s ease-in-out infinite}
.anim-lateral .arm-group{animation:lateralAnim 1.8s ease-in-out infinite}
.anim-lateral .arm-r.arm-group{animation-name:lateralAnimR}
.anim-crunch .body-group{animation:crunchAnim 1.8s ease-in-out infinite}
.anim-calf .body-group{animation:pressAnim 1.6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.fig-float,.fig-bounce,.arm{animation:none}.anim-curl .arm-group,.anim-press .arm-group,.anim-squat .body-group,.anim-pull .arm-group,.anim-lateral .arm-group,.anim-crunch .body-group,.anim-calf .body-group{animation:none}}
